name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven Wrapper (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x ./mvnw && ./mvnw -B clean verify

      - name: Build and test with Maven Wrapper (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B clean verify
